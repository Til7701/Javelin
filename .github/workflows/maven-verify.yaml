name: Maven Verify

permissions: { }

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 27 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'openjdk'
          cache: "maven"
      - name: Build and Test
        run: |
          ./mvnw clean verify --batch-mode --update-snapshots
      - name: Test Reproducibility
        run: |
          ./mvnw clean install -DskipTests -DskipITs --batch-mode
          ./mvnw clean verify artifact:compare -DskipTests -DskipITs --batch-mode
